    <path d="M1240 546 q11 -14 26 -14" stroke="#b8a1ff" opacity="0.5"/>
    <path d="M1325 233 C1301 217 1301 195 1317 195 C1323 195 1325 202 1325 202 C1325 202 1327 195 1333 195 C1349 195 1349 217 1325 233 Z" stroke="#ff7ab5" opacity="0.35"/>
